name: Build installable APK

# Every push to main (and manual runs) produces a debug APK you can install
# directly on a phone: download it from the run's Artifacts, or from the
# rolling "dev-latest" pre-release. All builds share the committed dev
# keystore signature, so updates install over the top.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # needed to update the dev-latest pre-release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # NOTE: no setup-android action — its default package list includes the
      # retired 'tools' package and now fails on current runner images.
      # ubuntu-latest ships a full Android SDK at $ANDROID_HOME; use it directly.
      - name: Install SDK platform, build-tools, NDK and CMake
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" \
                        "platform-tools" "ndk;26.3.11579264" "cmake;3.22.1"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Run host DSP tests
        run: |
          g++ -std=c++17 -O2 -I app/src/main/cpp app/src/main/cpp/test/dsp_chain_test.cpp -o /tmp/dsp_test
          /tmp/dsp_test

      - name: Check naming rule
        run: |
          ! grep -riE "[c]hurch|[c]athedral" app/ README.md CHANGELOG.md docs/

      - name: Run JVM unit tests
        run: |
          chmod +x gradlew
          ./gradlew testReleaseUnitTest --stacktrace

      - name: Build release APK (non-debuggable, dev-signed)
        run: |
          ./gradlew assembleRelease -PdevSigning=true --stacktrace

      - name: Verify 29 unmangled JNI symbols in APK
        run: |
          unzip -p app/build/outputs/apk/release/app-release.apk lib/arm64-v8a/libharamain_audio.so > /tmp/libharamain_audio.so
          COUNT=$(nm -D /tmp/libharamain_audio.so | grep -c "Java_com_haramain_monitor_audio_NativeAudioEngine_native")
          echo "Found $COUNT plain JNI symbols"
          test "$COUNT" -eq 29

      - name: Upload APK as run artifact
        uses: actions/upload-artifact@v4
        with:
          name: HaramainMonitor-debug-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 90

      - name: Publish to rolling dev-latest pre-release
        if: startsWith(github.ref, 'refs/heads/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        continue-on-error: true   # the artifact above is the guaranteed path
        with:
          tag_name: dev-latest
          name: Latest dev build (installable APK)
          prerelease: true
          body: |
            Auto-built release APK from the latest commit on main.
            Download app-release.apk below and open it on your phone to install
            (you may need to allow "install from this app" for your browser/Files).
            Signed with the project's stable dev key, so future builds update in place.
          files: app/build/outputs/apk/release/app-release.apk

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Haramain Monitor ${{ github.ref_name }}
          prerelease: false
          generate_release_notes: true
          files: app/build/outputs/apk/release/app-release.apk
